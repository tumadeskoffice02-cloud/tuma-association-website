<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TUMA | Admin Login</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071a30, #173b62);
    }

    .login-box {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 30px 24px;
      border-radius: 16px;
    }

    .logo {
      text-align: center;
      color: #d9ad45;
      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #102746;
      font-size: 24px;
    }

    p {
      text-align: center;
      color: #65738a;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      background: #102746;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    }

    #message {
      margin-top: 16px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #102746;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="login-box">
    <div class="logo">TUMA</div>
    <h1>Administrator Login</h1>
    <p>The United Minds Association<br>Authorized administrators only</p>

    <form id="loginForm">
      <label for="email">Administrator Email</label>
      <input
        type="email"
        id="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">Sign In</button>
      <p id="message" role="status"></p>
    </form>

    <a class="back-link" href="index.html">← Return to TUMA Website</a>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // STEP 7: Replace these two placeholders with your own project details.
    const SUPABASE_URL = "https://hhmegtbfgyjbsiuwozpq.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_dTyN0hMfFisKrO965XCN1g_ARyIKyCX";

    const message = document.getElementById('message');
    const button = document.getElementById('loginButton');

    const configurationIsMissing =
      SUPABASE_URL.includes("https://hhmegtbfgyjbsiuwozpq.supabase.co") ||
      SUPABASE_PUBLISHABLE_KEY.includes("sb_publishable_dTyN0hMfFisKrO965XCN1g_ARyIKyCX");

    if (!configurationIsMissing) {
      const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      document.getElementById('loginForm').addEventListener(
        'submit',
        async (event) => {
          event.preventDefault();
          button.disabled = true;
          message.textContent = 'Signing in...';

          try {
            const { data, error } =
              await supabase.auth.signInWithPassword({
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
              });

            if (error) throw error;

            // Authentication succeeded, but admin authorization
            // has not yet been implemented.
            await supabase.auth.signOut();

            message.textContent =
              'Sign-in was successful, but administrator permissions ' +
              'are not configured yet. The dashboard has not been opened.';
          } catch (error) {
            message.textContent =
              'Sign-in failed. Check your email and password, and try again.';
          } finally {
            button.disabled = false;
          }
        }
      );
    } else {
      document.getElementById('loginForm').addEventListener(
        'submit',
        (event) => {
          event.preventDefault();
          message.textContent =
            'Setup is incomplete. Add your Supabase project details first.';
        }
      );
    }
  </script>
</body>
</html>
